name: Android CI

# 触发条件：
#   - 推送到 main / master
#   - 针对 main / master 的 PR
#   - 手动触发（便于随时出包，无需改代码）
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的并发构建只保留最新一次，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug & release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 本仓库未提交 gradle-wrapper.jar（二进制文件），
      # 因此由该 action 提供固定版本的 Gradle 并接管依赖缓存。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      # 仓库默认开启阿里云镜像（useChinaMirrors=true），
      # CI 位于海外时反而更慢，这里显式关闭以走官方源。
      - name: Disable China mirrors
        run: |
          sed -i 's/^useChinaMirrors=.*/useChinaMirrors=false/' gradle.properties
          grep -n '^useChinaMirrors' gradle.properties

      # build-logic 是独立构建，其 pluginManagement 需要显式声明插件版本，
      # 无法读取根项目的 version catalog，因此这里校验两处不漂移。
      - name: Verify plugin versions are in sync
        run: |
          fail=0
          check() {
            local key=$1 file=$2
            local a b
            a=$(grep -oP "(?m)^\s*$key\s*=\s*\"\K[^\"]+" gradle/libs.versions.toml | head -1)
            b=$(grep -oP "(?m)^\s*val ${key}Version\s*=\s*\"\K[^\"]+" build-logic/settings.gradle.kts | head -1)
            printf '%-8s catalog=%-10s build-logic=%-10s' "$key" "${a:-?}" "${b:-?}"
            if [ -n "$a" ] && [ "$a" = "$b" ]; then echo 'OK'; else echo 'MISMATCH'; fail=1; fi
          }
          check agp
          check kotlin
          check detekt
          exit $fail

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :core:app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK (unsigned)
        # release 未配置签名，assembleRelease 产出未签名 APK；
        # 这样 CI 无需任何密钥即可验证 release 变体（含 R8 混淆）是否可构建。
        run: gradle :core:app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mt-manager-debug-apk
          path: core/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: mt-manager-release-apk-unsigned
          path: core/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        # 测试失败时也保留报告，便于定位问题
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
